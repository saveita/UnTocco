<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="UnTocco">
<meta name="theme-color" content="#e7ebf0">
<title>UnTocco — La tua voce</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  [hidden]{display:none!important}
  img{max-width:100%}
  :root{
    --ground:#e7ebf0;
    --frame:#c3cad4;
    --panel:#ffffff;
    --panel-sunken:#f1f4f8;
    --ink:#182231;
    --ink-soft:#516074;
    --hair:#d7dde5;
    --neutral:#33506e;
    --neutral-ink:#ffffff;
    --yes:#127a3e;
    --yes-ink:#ffffff;
    --no:#bd3124;
    --no-ink:#ffffff;
    --maybe:#b9820a;
    --maybe-ink:#20170a;
    --urgent:#d21f2c;
    --urgent-ink:#ffffff;
    --shadow:0 2px 0 rgba(24,34,49,.14),0 10px 24px rgba(24,34,49,.12);
    --shadow-press:0 1px 0 rgba(24,34,49,.18);
    --r:20px;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --ground:#0c1015;
      --frame:#04070a;
      --panel:#1b2330;
      --panel-sunken:#141b26;
      --ink:#eef2f7;
      --ink-soft:#9fb0c4;
      --hair:#3d5069;
      --neutral:#5c82ad;
      --neutral-ink:#08111c;
      --yes:#2ea45f;
      --yes-ink:#04140a;
      --no:#e5584c;
      --no-ink:#170606;
      --maybe:#e0a92c;
      --maybe-ink:#1a1305;
      --urgent:#f24a55;
      --urgent-ink:#1a0406;
      --shadow:0 2px 0 rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.45);
      --shadow-press:0 1px 0 rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0c1015;
    --frame:#04070a;
    --panel:#1b2330;
    --panel-sunken:#141b26;
    --ink:#eef2f7;
    --ink-soft:#9fb0c4;
    --hair:#3d5069;
    --neutral:#5c82ad;
    --neutral-ink:#08111c;
    --yes:#2ea45f;
    --yes-ink:#04140a;
    --no:#e5584c;
    --no-ink:#170606;
    --maybe:#e0a92c;
    --maybe-ink:#1a1305;
    --urgent:#f24a55;
    --urgent-ink:#1a0406;
    --shadow:0 2px 0 rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.45);
    --shadow-press:0 1px 0 rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
    background:var(--ground);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    margin:0;padding:0;
    height:100vh;height:100dvh;overflow:hidden;
  }
  .wrap{max-width:none;margin:0;height:100%}
  /* barra comandi minima dentro l'app */
  .topbar{display:flex;justify-content:flex-end;gap:8px}
  .theme-toggle{
    font-family:inherit;font-size:13px;color:var(--ink-soft);
    background:var(--panel);border:1px solid var(--hair);border-radius:999px;
    padding:6px 14px;cursor:pointer;
  }
  .theme-toggle:hover{color:var(--ink)}
  .voice-wrap{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);
    background:var(--panel);border:1px solid var(--hair);border-radius:999px;padding:4px 10px 4px 12px}
  .voice-select{
    font-family:inherit;font-size:13px;color:var(--ink);background:transparent;
    border:none;cursor:pointer;max-width:150px;padding:2px 4px;
  }
  .voice-select:focus-visible{outline:3px solid var(--neutral);outline-offset:2px;border-radius:6px}

  /* app a tutto schermo (niente cornice) */
  .ipad{background:none;padding:0;box-shadow:none;position:relative;height:100%}
  .ipad::before{display:none}
  .screen{
    background:var(--ground);
    border-radius:0;
    padding:14px;
    display:flex;flex-direction:column;gap:12px;
    height:100%;
    position:relative;
    overflow:hidden;
  }

  /* Compose bar */
  .compose{
    display:grid;grid-template-columns:1fr;gap:12px;align-items:stretch;
  }
  .btn-clear{background:var(--panel);border:2px solid var(--no);color:var(--no);min-width:92px}
  .btn-clear .ico{font-size:26px;color:var(--no)}
  .btn-clear .lab{font-size:13px;letter-spacing:.2px}
  .phrase{
    background:var(--panel);border:1px solid var(--hair);border-radius:var(--r);
    padding:16px 20px;min-height:78px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:var(--shadow-press);cursor:pointer;position:relative;
    -webkit-tap-highlight-color:transparent;
  }
  .phrase:active{transform:translateY(1px)}
  .phrase:focus-visible{outline:4px solid var(--neutral);outline-offset:3px}
  .phrase .hint{
    position:absolute;top:10px;right:16px;display:flex;align-items:center;gap:6px;
    font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-soft);
  }
  .phrase .hint .ico{font-size:20px}
  .phrase .status{
    font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--maybe);display:none;margin-bottom:4px;
  }
  .phrase.preparing .status{display:block;animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.4}}
  .phrase .text{font-size:26px;font-weight:700;line-height:1.15;text-wrap:balance}
  .phrase .text.placeholder{color:var(--ink-soft);font-weight:400}

  .btn{
    font-family:inherit;border:1px solid var(--hair);border-radius:var(--r);cursor:pointer;
    font-weight:700;color:var(--ink);background:var(--panel);
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    padding:14px;transition:transform .05s ease, box-shadow .05s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:translateY(2px);box-shadow:var(--shadow-press)}
  .btn:focus-visible{outline:4px solid var(--neutral);outline-offset:3px}
  .btn .ico{font-size:30px;line-height:1}
  .btn .lab{font-size:16px;letter-spacing:.3px}

  .btn-speak{background:var(--neutral);color:var(--neutral-ink);min-width:150px}
  .btn-speak .ico{font-size:34px}
  .btn-speak .lab{font-size:22px;letter-spacing:.5px}
  .btn-stop{background:var(--panel-sunken);min-width:96px}

  /* Predictive words during composition (home) */
  .home-suggests{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
  .hsugg{min-height:54px;background:var(--panel);flex-direction:row}
  .hsugg .lab{font-size:18px;font-weight:700;letter-spacing:.2px}
  .hsugg[disabled]{visibility:hidden}

  /* Intentions */
  .intentions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px}
  .intent{min-height:104px}
  .intent .ico{font-size:38px}
  .intent .lab{font-size:22px;letter-spacing:.5px}
  .intent.yes{background:#2e6b4e;color:#fff}
  .intent.maybe{background:#8a6a1e;color:#fff}
  .intent.no{background:#313d4d;color:#fff}
  .intent .ico{width:66px;height:66px;border-radius:50%;border:3px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:34px}
  .intent .ico svg{color:#fff;stroke-width:2.4}
  .intent .lab{color:#fff;font-size:24px;letter-spacing:.6px}

  /* Middle: contexts + side */
  .middle{display:grid;grid-template-columns:210px 1fr;gap:14px;flex:1;min-height:0}
  .middle.nohelp{grid-template-columns:1fr}
  .contexts{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:26px}
  .ctx .ico{font-size:40px}
  /* icone disegnate (SVG) dei contesti */
  .ico svg,.em svg{width:1em;height:1em;display:inline-block;vertical-align:middle;
    fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--neutral)}
  /* icone immagine (PNG) */
  .ico .icoimg,.em .icoimg{width:1.6em;height:1.6em;display:inline-block;vertical-align:middle}
  .theme-toggle .icoimg{width:22px;height:22px;display:inline-block;vertical-align:middle}
  .dpad{display:inline-grid;grid-template-columns:repeat(3,1em);grid-template-rows:repeat(3,1em);
    font-size:.5em;line-height:1;place-items:center;vertical-align:middle;font-weight:700}
  .dpad .u{grid-column:2;grid-row:1}
  .dpad .l{grid-column:1;grid-row:2}
  .dpad .r{grid-column:3;grid-row:2}
  .dpad .d{grid-column:2;grid-row:3}
  .ctx .lab{font-size:17px}
  .side{display:grid;grid-template-rows:1fr;gap:12px}
  .btn-mode{background:var(--panel);border:2px solid var(--neutral)}
  .btn-mode .ico{font-size:34px;color:var(--neutral)}
  .btn-mode .lab{font-size:16px}
  .btn-help{background:#ab3d34;color:#fff}
  .btn-help .ico{width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
  .btn-help .ico svg{color:#fff;stroke-width:2.2;width:46px;height:46px}
  /* category tiles: icon top-left, title + subtitle below */
  .ctx{flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;padding:16px 18px;gap:12px}
  .ctx .ctxicon{width:106px;height:106px;min-height:106px;border-radius:24px;background:rgba(255,255,255,.17);display:flex;align-items:center;justify-content:center;font-size:62px}
  .ctx .ctxicon svg{color:#fff;stroke-width:2}
  .ctxtext{display:flex;flex-direction:column;gap:2px;margin-top:auto;width:100%}
  .ctx .lab{font-size:22px;line-height:1.1;color:#fff}
  .ctx .sub{font-size:13px;font-weight:400;color:rgba(255,255,255,.82);letter-spacing:.2px}
  /* message card header */
  .msgcard{background:var(--panel);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow-press);display:flex;align-items:stretch;gap:12px;padding:12px 14px}
  .msgcard .phrase{flex:1;background:transparent;border:none;box-shadow:none;padding:6px 8px;min-height:60px;justify-content:center}
  .msgcard .phrase:active{transform:none}
  .phrase .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
  .msgactions{display:flex;align-items:center;gap:10px}
  .msgbtn{font-family:inherit;font-weight:700;cursor:pointer;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:9px;-webkit-tap-highlight-color:transparent;transition:transform .05s ease}
  .msgbtn:active{transform:translateY(1px)}
  .msgbtn:focus-visible{outline:4px solid var(--neutral);outline-offset:3px}
  .msg-trash{width:66px;background:var(--panel);border:2px solid var(--maybe);color:var(--maybe)}
  .msg-trash svg{width:27px;height:27px;color:var(--maybe);stroke-width:2}
  .msg-speak{min-width:158px;background:var(--yes);border:none;color:#fff;font-size:23px;padding:0 24px;box-shadow:var(--shadow)}
  .msg-speak svg{width:29px;height:29px;color:#fff;stroke-width:2.2}
  .btn-help .ico{font-size:40px}
  .btn-help.repeating{animation:pulse 1s ease-in-out infinite;outline:5px solid var(--urgent);outline-offset:3px}
  .btn-help .lab{font-size:22px;letter-spacing:1px}

  /* Permanent quick bar */
  .quickbar{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
  .quick{min-height:66px;background:var(--panel-sunken)}
  .quick .lab{font-size:15px;letter-spacing:.3px}
  .quick .ico{font-size:22px}

  /* Context overlay */
  .overlay{
    position:absolute;inset:0;background:var(--ground);
    padding:16px;display:none;flex-direction:column;gap:12px;z-index:5;
  }
  .overlay.open{display:flex}
  .ovhead{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
  .btn-back{background:var(--panel);min-height:66px;min-width:150px;flex-direction:row;gap:10px}
  .btn-back .ico{font-size:26px}
  .btn-back .lab{font-size:18px}
  .ovtitle{font-size:30px;font-weight:700;display:flex;align-items:center;gap:14px}
  .ovtitle .em{font-size:42px}
  .ovgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:26px;flex:1}
  .need{background:var(--panel);min-height:120px;gap:12px}
  .need .ico{font-size:56px}
  .need .lab{font-size:25px;line-height:1.15;text-wrap:balance}
  .need small{display:block;font-weight:400;color:var(--ink-soft);font-size:17px;margin-top:4px}

  /* Keyboard */
  .keyboard{
    position:absolute;inset:0;background:var(--ground);z-index:7;
    display:none;flex-direction:column;padding:14px;gap:10px;
  }
  .keyboard.open{display:flex}
  .kb-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:stretch}
  .kb-field{
    background:var(--panel);border:1px solid var(--hair);border-radius:16px;
    padding:12px 18px;display:flex;align-items:center;min-height:64px;
    font-size:24px;font-weight:700;box-shadow:var(--shadow-press);
  }
  .kb-field .caret{display:inline-block;width:3px;height:26px;background:var(--neutral);margin-left:2px;animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .kb-field.empty{color:var(--ink-soft);font-weight:400}
  .kb-speak{min-width:130px;background:var(--neutral);color:var(--neutral-ink)}
  .kb-speak .ico{font-size:28px}.kb-speak .lab{font-size:18px}
  .suggests{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sugg{min-height:56px;background:var(--panel-sunken);flex-direction:row}
  .sugg .lab{font-size:19px;font-weight:700}
  .sugg:empty{visibility:hidden}
  .freq-row{display:flex;gap:8px}
  .freq{
    flex:1;background:var(--panel-sunken);border:2px dashed var(--neutral);
    min-height:58px;flex-direction:row;gap:12px;justify-content:flex-start;padding:10px 18px;
  }
  .freq-del{
    background:var(--panel);border:2px solid var(--no);color:var(--no);
    min-height:58px;min-width:58px;font-size:24px;
  }
  .freq .ico{font-size:22px;color:var(--neutral)}
  .freq .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);font-weight:700;white-space:nowrap}
  .freq .lab{font-size:20px;font-weight:700;text-align:left;text-wrap:balance}
  .kb-rows{display:flex;flex-direction:column;gap:26px;flex:1;justify-content:stretch}
  .kb-row{display:flex;gap:26px;justify-content:stretch;flex:1}
  .key{
    flex:1;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);
    font-family:inherit;font-weight:700;font-size:clamp(28px,4.2vw,52px);color:var(--ink);
    border:1px solid var(--hair);cursor:pointer;min-height:56px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .05s ease,box-shadow .05s ease;-webkit-tap-highlight-color:transparent;
  }
  .key:active{transform:translateY(2px);box-shadow:var(--shadow-press)}
  .key:focus-visible{outline:4px solid var(--neutral);outline-offset:2px}
  .kb-actions{display:grid;grid-template-columns:1.2fr 1fr 1fr auto auto;gap:10px}
  .key-mode{color:var(--neutral);border:2px solid var(--neutral);font-size:20px!important;flex:1.3}
  .kb-actions .btn{min-height:64px;flex-direction:row;gap:10px}
  .k-space{background:var(--panel-sunken)}
  .k-back,.k-backword{background:var(--maybe);color:var(--maybe-ink)}
  .k-back .ico,.k-backword .ico{font-size:24px}
  .k-back .lab,.k-backword .lab{font-size:16px}
  .k-clear{background:var(--panel);border:2px solid var(--no);color:var(--no)}
  .k-clear .lab{font-size:15px}
  .k-close{background:var(--panel);min-width:120px}
  .k-close .lab{font-size:16px}
  /* left-hand mode mirrors the action row so the big keys sit under the working hand */
  .keyboard.left .kb-actions{direction:rtl}
  .keyboard.left .kb-actions .btn{direction:ltr}
  /* Confirm dialog (sostituisce window.confirm, bloccato in sandbox) */
  .confirm{
    position:absolute;inset:0;z-index:9;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(10,15,22,.55);
  }
  .confirm.open{display:flex}
  .confirm-box{
    background:var(--panel);border-radius:24px;box-shadow:var(--shadow);
    padding:26px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:20px;
    border:1px solid var(--hair);
  }
  .confirm-msg{font-size:26px;font-weight:700;text-align:center;text-wrap:balance}
  .confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .confirm-actions .btn{min-height:88px;flex-direction:row;gap:10px}
  .c-cancel{background:var(--panel-sunken)}
  .c-cancel .lab{font-size:20px}
  .c-ok{background:var(--no);color:var(--no-ink)}
  .c-ok .ico{font-size:26px}
  .c-ok .lab{font-size:20px;letter-spacing:.3px}
  .hand-toggle{
    position:absolute;top:14px;right:14px;z-index:2;
    font-family:inherit;font-size:13px;color:var(--ink-soft);
    background:var(--panel);border:1px solid var(--hair);border-radius:999px;padding:6px 12px;cursor:pointer;
  }

  /* Indicazione voce che parla */
  .speakbar{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:8;
    background:var(--neutral);color:var(--neutral-ink);border-radius:999px;
    padding:8px 20px;font-weight:700;font-size:16px;letter-spacing:.4px;
    box-shadow:var(--shadow);animation:pulse 1s ease-in-out infinite;
  }
  .speakbar .ico{font-size:18px}
  /* Flash di conferma visiva dopo un comando */
  .cmd-flash{outline:5px solid var(--neutral)!important;outline-offset:2px!important}

  /* Pannello opzioni caregiver */
  .options{
    position:absolute;inset:0;z-index:10;background:var(--ground);
    display:none;flex-direction:column;padding:16px;gap:14px;overflow:auto;
  }
  .options.open{display:flex}
  .opt-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .opt-title{font-size:24px;font-weight:700}
  .opt-body{display:flex;flex-direction:column;gap:22px}
  .opt-sec{background:var(--panel);border:1px solid var(--hair);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
  .opt-sec h3{margin:0;font-size:16px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-soft)}
  .opt-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .opt-row label{font-size:15px;min-width:180px}
  .opt-list{display:flex;flex-direction:column;gap:8px}
  .opt-item{display:flex;align-items:center;gap:8px}
  .opt-item input[type=text]{flex:1}
  .options input[type=text],.options input[type=number],.options input[type=password],.options select{
    font-family:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--hair);
    border-radius:10px;background:var(--panel);color:var(--ink);min-width:0;
  }
  .opt-btn{
    font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;
    background:var(--panel);color:var(--ink);border:1px solid var(--hair);
    border-radius:10px;padding:10px 16px;
  }
  .opt-btn.primary{background:var(--neutral);color:var(--neutral-ink);border-color:var(--neutral)}
  .opt-btn.danger{background:var(--panel);color:var(--no);border:2px solid var(--no)}
  .opt-check{display:flex;align-items:center;gap:10px;font-size:16px}
  .opt-check input{width:24px;height:24px}
  /* Tastierino PIN */
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px}
  .pinpad .opt-btn{min-height:64px;font-size:24px}
  .pin-display{font-size:32px;letter-spacing:8px;min-height:40px;text-align:center;font-weight:700}

  .note{margin-top:16px;color:var(--ink-soft);font-size:13.5px;line-height:1.6;max-width:74ch}
  .note b{color:var(--ink)}
  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:13px;color:var(--ink-soft)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .dot{width:13px;height:13px;border-radius:4px;display:inline-block}
  .voice-off{display:none}
  body.no-voice .voice-off{display:inline}

  @media (max-width:820px){
    html,body{height:auto;overflow-y:auto;overflow-x:hidden}
    .ipad{height:auto}
    .screen{aspect-ratio:auto;height:auto;min-height:100dvh;padding-bottom:24px}
    .middle{grid-template-columns:1fr;flex:none}
    .side{grid-template-rows:auto;grid-template-columns:1fr}
    .btn-help{min-height:150px}
    .contexts{grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(150px,auto)}
    .compose{grid-template-columns:1fr}
    .msgcard{flex-direction:column;align-items:stretch}
    .msgactions{justify-content:flex-end}
    .msg-speak{flex:1}
    .quickbar{grid-template-columns:repeat(2,1fr)}
    .btn-stop{grid-column:2}
    /* Tastiera e sotto-menù: altezza schermo fissa e scorrevole (niente tasti giganti) */

<script>
(function(){
  // Salvataggio locale sul dispositivo (permanente e privato). try/catch:
  // nell'anteprima in chat può essere disattivato, sull'iPad funziona.
  var LS={

  // ---- impostazioni (modificabili dal pannello opzioni caregiver) ----

  if(!settings.hidden) settings.hidden={};                    // funzioni nascoste

  var EXTRA_CONTACTS=["il Dott. Fabio","il medico","l'assistente"];

  var contexts = [
    {key:"casa", em:"<svg viewBox='0 0 24 24'><path d='M4 11l8-6 8 6'/><path d='M6 10v9h12v-9'/></svg>", lab:"Casa", sub:"Stanze, oggetti, TV", needs:[
      {em:"\u{1F975}", t:"Ho caldo"},

      {em:"\u{1F469}", t:"Chiama Roberta, per favore", s:"figlia"},
      {em:"\u{1F468}", t:"Chiama Michele, per favore", s:"figlio"},

      {em:"\u{1F4DE}", t:"Vorrei chiamare", s:"scegli il nome", compose:true}

    {key:"bagno", em:"<svg viewBox='0 0 24 24'><path d='M4 12h16'/><path d='M12 12V6a3 3 0 0 1 6 0'/><path d='M8 15.5v1.5M12 15.5v2.5M16 15.5v1.5'/></svg>", lab:"Bagno e igiene", sub:"Toilette, doccia, vestirsi", needs:[
      {em:"\u{1F6BD}", t:"Devo andare in bagno, per favore"},

    ]},
    {key:"spostamenti", em:"<svg viewBox='0 0 24 24'><path d='M12 3v18M3 12h18'/><path d='M12 3l-2.4 2.4M12 3l2.4 2.4M12 21l-2.4-2.4M12 21l2.4-2.4M3 12l2.4-2.4M3 12l2.4 2.4M21 12l-2.4-2.4M21 12l2.4 2.4'/></svg>", lab:"Spostamenti", sub:"Alzarsi, uscire, posizione", needs:[
      {em:"\u{1F6CF}", t:"Vorrei andare in camera, per favore"},
      {em:"\u{1F6CB}", t:"Vorrei andare in soggiorno, per favore"},
      {em:"\u{1F37D}", t:"Vorrei andare in sala, per favore"},
      {em:"\u{1F6BD}", t:"Vorrei andare in bagno, per favore"},
      {em:"\u{1FA91}", t:"Vorrei andare in poltrona, per favore"},
      {em:"\u{1F333}", t:"Vorrei andare in giardino, per favore"},
      {em:"\u{1F9CD}", t:"Vorrei alzarmi, per favore"},
      {em:"\u{1F9ED}", t:"Andiamo da un'altra parte, per favore"}
    ]}
  ];

  // ---- speech ----
  var synth = window.speechSynthesis;
  var voice = null;
  var saySeq = 0; // conta le frasi pronunciate: serve per l'auto-cancellazione a fine pronuncia
  var helpRepeating = false; // AIUTO: ripete finché non si preme STOP o un altro comando
  function pickVoice(){
    if(!synth) return;
    var it=(synth.getVoices()||[]).filter(function(v){ return /^it/i.test(v.lang); })
      .sort(function(a,b){ return (b.localService?1:0)-(a.localService?1:0); }); // locali (offline) prima
    // Safari espone alle web app solo un insieme ridotto di voci: per l'italiano Alice.
    voice = it.find(function(v){ return /alice/i.test(v.name); }) || it[0] || null;
  }
  if(synth){ pickVoice(); if(synth.onvoiceschanged!==undefined) synth.onvoiceschanged=pickVoice; }
  if(!synth) document.body.classList.add("no-voice");

  // iOS/Safari: la sintesi vocale resta "sospesa" finché non parte da un gesto dell'utente.
  // Al primo tocco la sblocchiamo con una frase muta, così i tocchi successivi parlano.
  var __voiceUnlocked=false;
  function unlockVoice(){
    if(__voiceUnlocked||!synth) return;
    __voiceUnlocked=true;
    try{ synth.resume(); }catch(e){}
    try{ var u=new SpeechSynthesisUtterance(" "); u.volume=0; u.lang="it-IT"; synth.speak(u); }catch(e){}
    if(!voice) pickVoice();
  }
  document.addEventListener("touchend", unlockVoice, {passive:true});
  document.addEventListener("pointerdown", unlockVoice, {passive:true});
  document.addEventListener("click", unlockVoice, true);

  // AIUTO ripetuto
  function speakHelp(){
    if(!helpRepeating||!synth) return;
    try{
      if(!voice) pickVoice();
      var u=new SpeechSynthesisUtterance("Aiuto");
      u.lang="it-IT"; u.rate=1; u.pitch=1; if(voice) u.voice=voice;
      u.onstart=function(){ setSpeaking(true); };
      u.onend=function(){ setSpeaking(false); if(helpRepeating) setTimeout(speakHelp, 2000); };
      synth.speak(u);
    }catch(e){}
  }
  function startHelp(){
    if(!synth) return;
    helpRepeating=true;
    var b=document.getElementById("helpBtn"); if(b) b.classList.add("repeating");
    if(synth.speaking||synth.pending){ synth.cancel(); setTimeout(speakHelp,90); }
    else { try{ synth.resume(); }catch(e){} speakHelp(); }
  }
  function stopHelp(){
    helpRepeating=false;
    var b=document.getElementById("helpBtn"); if(b) b.classList.remove("repeating");
    if(synth) synth.cancel();
  }

  function say(text){
    if(!synth){ return; }
    try{
      stopHelp();                       // un nuovo comando ferma l'allarme AIUTO
      if(!voice) pickVoice();
      var myId=++saySeq;
      var u = new SpeechSynthesisUtterance(text);
      u.lang="it-IT"; u.rate=1;
      u.pitch = 1;
      if(voice) u.voice=voice;
      u.onstart=function(){ setSpeaking(true); };
      // A pronuncia finita, cancella automaticamente il messaggio dal display
      // (solo se nel frattempo non è partita una nuova frase).
      u.onend=function(){ setSpeaking(false); if(myId===saySeq){ setPhrase(""); preparing(false); } };
      if(settings.feedback) beep();
      // iOS: se qualcosa è già in riproduzione, annulla e riparla con un piccolo ritardo
      // (cancel() subito prima di speak() su iOS "mangia" la frase). Se non c'è nulla in corso,
      // parla subito dentro il gesto del tocco: è così che iOS sblocca l'audio.
      if(synth.speaking || synth.pending){
        synth.cancel();
        setTimeout(function(){ try{ synth.resume(); synth.speak(u); }catch(e){} }, 90);
      } else {
        try{ synth.resume(); }catch(e){}
        synth.speak(u);
      }
    }catch(e){}
  }

  // ---- phrase history (mockup: storico d'esempio, tenuto in memoria) ----
  var history=LS.get("history", {
    "Voglio andare in bagno":9,
    "Ho sete":7,
    "Ho dolore":6,
    "Voglio riposare a letto":5,
    "Chiamate il medico":3
  });
  function topPhrase(){
    var best=null,bestN=-1;
    for(var k in history){ if(history[k]>bestN){ best=k; bestN=history[k]; } }
    return best;
  }
  function renderFreq(){
    var row=document.getElementById("freqRow");
    var el=document.getElementById("freqBtn");
    if(!row||!el) return;
    var p=topPhrase();
    if(p){ el.querySelector(".lab").textContent=p; row.hidden=false; }
    else { row.hidden=true; }
  }
  function recordPhrase(text){
    text=(text||"").trim();
    if(!text || text.split(/\s+/).length<2){ return; } // conta solo le frasi, non le parole singole
    history[text]=(history[text]||0)+1;
    LS.set("history", history);
    renderFreq();
  }

  // ---- in-app confirm (window.confirm è bloccato nell'anteprima sandbox) ----
  var confirmEl=document.getElementById("confirm");

  function askConfirm(msg, cb){

  }
  document.getElementById("confirmYes").addEventListener("click", function(){
    confirmEl.classList.remove("open");
    var f=confirmCb; confirmCb=null; if(f) f();
  });
  document.getElementById("confirmNo").addEventListener("click", function(){
    confirmEl.classList.remove("open"); confirmCb=null;
  });

  // ---- phrase state ----
  var phrase=document.getElementById("phrase");
  var phraseText=document.getElementById("phraseText");
  var current="";
  function setPhrase(t){
    current=t||"";
    if(current){ phraseText.textContent=current; phraseText.classList.remove("placeholder"); }
    else { phraseText.textContent="Tocca qui per scrivere…"; phraseText.classList.add("placeholder"); }
    if(typeof renderHomeSuggests==="function"){ renderHomeSuggests(); }
  }
  // gentle "preparing" affordance whenever a phrase is staged but not yet spoken
  function preparing(on){ phrase.classList.toggle("preparing", !!on); }

  // ---- costruzione contesti (Persone e "Le mie frasi" sono dinamici) ----
  var ctxWrap=document.getElementById("contexts");
  function buildPersone(){
    var p=null; for(var i=0;i<contexts.length;i++){ if(contexts[i].key==="persone"){ p=contexts[i]; break; } }
    if(!p) return;
    p.needs=settings.contacts.map(function(c){
      return {em: femaleRel(c.rel)?"\u{1F469}":"\u{1F468}", t:"Chiama "+c.name, s:c.rel};
    });
    p.needs.push({em:"\u{1F4DE}", t:"Vorrei chiamare", s:"scegli il nome", compose:true});
  }
  function buildMyPhrases(){
    for(var i=contexts.length-1;i>=0;i--){ if(contexts[i].key==="miefrasi") contexts.splice(i,1); }
    if(settings.phrases && settings.phrases.length){
      contexts.push({key:"miefrasi", em:"⭐", lab:"Le mie frasi",
        needs: settings.phrases.map(function(t){ return {em:"\u{1F4AC}", t:t}; })});
    }
  }
  var ICON_BG={casa:"#2d5f7a",cibo:"#8a6a1e",salute:"#6f3a52",persone:"#3c5f45",bagno:"#2d6178",spostamenti:"#4b4a70",miefrasi:"#4b4a70"};
  var ICON_INK={};
  function renderContexts(){
    contacts=contactNames();
    buildPersone(); buildMyPhrases();
    ctxWrap.innerHTML="";
    contexts.forEach(function(c){
      if(settings.hidden["ctx_"+c.key]) return; // funzione nascosta dal caregiver
      var b=document.createElement("button");
      b.className="btn ctx"; b.type="button";
      b.innerHTML='<span class="ico ctxicon" aria-hidden="true">'+c.em+'</span><span class="ctxtext"><span class="lab">'+c.lab+'</span>'+(c.sub?'<span class="sub">'+c.sub+'</span>':'')+'</span>';
      var bg=ICON_BG[c.key];
      if(bg){ b.style.backgroundColor=bg; b.style.borderColor=bg; b.style.color=ICON_INK[c.key]||"#ffffff"; }
      b.addEventListener("click", function(){ openCtx(c); });
      ctxWrap.appendChild(b);
    });
  }
  renderContexts();

  // ---- overlay ----
  var overlay=document.getElementById("overlay");
  var ovtitle=document.getElementById("ovtitle");
  var ovgrid=document.getElementById("ovgrid");

  function closeOverlay(){ overlay.classList.remove("open"); ovStack=[]; try{phrase.focus();}catch(e){} }
  function renderLevel(){
    var lvl=ovStack[ovStack.length-1];
    ovtitle.innerHTML='<span class="em" aria-hidden="true">'+lvl.em+'</span>'+lvl.title;
    ovgrid.innerHTML="";
    lvl.needs.forEach(function(n){
      var b=document.createElement("button");
      b.className="btn need"; b.type="button";
      var label=n.lab||n.t;
      b.innerHTML='<span class="ico" aria-hidden="true">'+n.em+'</span><span class="lab">'+label+(n.s?'<small>'+n.s+'</small>':'')+'</span>';
      b.addEventListener("click", function(){
        if(n.sub){ ovStack.push({title:(n.lab||n.t), em:n.em, needs:n.sub}); renderLevel(); return; } // apre il sotto-menù
        if(n.compose){ setPhrase(n.t+" "); preparing(true); closeOverlay(); return; } // in composizione, mostra i nomi
        setPhrase(n.t); say(n.t); recordPhrase(n.t); preparing(false); // resta nella sezione: si esce con INDIETRO
      });
      ovgrid.appendChild(b);
    });
    overlay.classList.add("open");
    setTimeout(function(){ var el=document.getElementById("backBtn"); if(el) el.focus(); },0);
  }

  });
  document.getElementById("kbSpeak").addEventListener("click",function(){
    var t=kbText.trim();
    if(t){ setPhrase(t); say(t); recordPhrase(t); preparing(false); keyboard.classList.remove("open"); try{phrase.focus();}catch(e){} }
  });
  document.getElementById("kClose").addEventListener("click",function(){
    var t=kbText.trim();
    if(t){ setPhrase(t); preparing(true); } // staged but not yet spoken
    keyboard.classList.remove("open");
    try{phrase.focus();}catch(e){}
  });

  // ---- tastiera fisica (uso su computer) ----
  function isControl(el){
    if(!el) return false;
    var t=(el.tagName||"").toLowerCase();
    return t==="button"||t==="select"||t==="a"||t==="input"||t==="textarea"||
      (el.getAttribute && el.getAttribute("role")==="button");
  }
  document.addEventListener("keydown", function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;      // lascia le scorciatoie del sistema
    var kbOpen=keyboard.classList.contains("open");
    var key=e.key, onControl=isControl(e.target);

    if(key==="Escape"){
      if(confirmEl.classList.contains("open")){ confirmEl.classList.remove("open"); confirmCb=null; }
      else if(kbOpen){ keyboard.classList.remove("open"); }
      else if(document.getElementById("options").classList.contains("open")){ closeOptions(); }
      else if(overlay.classList.contains("open")){ closeOverlay(); }
      return;
    }
    if(key==="Enter"){
      if(onControl && !kbOpen) return;              // lascia attivare il pulsante a fuoco
      e.preventDefault();
      if(kbOpen){ var t=kbText.trim(); if(t){ setPhrase(t); say(t); recordPhrase(t); preparing(false); keyboard.classList.remove("open"); } }
      else if(current.trim()){ say(current); recordPhrase(current); preparing(false); }
      return;
    }
    if(key==="Backspace"){
      e.preventDefault();
      if(kbOpen){ kbText=kbText.slice(0,-1); renderKb(); }
      else { setPhrase(current.slice(0,-1)); preparing(!!current.trim()); }
      return;
    }
    if(key===" "){
      if(onControl && !kbOpen) return;              // lo spazio attiva il pulsante a fuoco
      e.preventDefault();
      if(kbOpen){ kbText+=" "; renderKb(); } else { setPhrase(current+" "); preparing(!!current.trim()); }
      return;
    }
    if(key.length===1){                              // carattere stampabile
      e.preventDefault();
      if(kbOpen){ kbText+=key.toLowerCase(); renderKb(); }
      else {
        var isFirst=current.replace(/\s+$/,"")==="";
        var ch=(isFirst && /[a-zà-ÿ]/i.test(key)) ? key.toUpperCase() : key;
        setPhrase(current+ch); preparing(true);
      }
      return;
    }
  });

  // ================= ACCESSIBILITÀ E OPZIONI =================

  function setSpeaking(on){ var b=document.getElementById("speakbar"); if(b) b.hidden=!on; }

  var actx=null;
  function beep(){
    try{
      if(!actx){ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; actx=new AC(); }
      if(actx.state==="suspended") actx.resume();
      var o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=880; g.gain.value=0.05;
      o.connect(g); g.connect(actx.destination);
      var t=actx.currentTime; o.start(t); o.stop(t+0.08);
    }catch(e){}
  }

  function applyHidden(){
    var q=document.querySelector(".quickbar"); if(q) q.hidden=!!settings.hidden.quickbar;
    var intent=document.querySelector(".intentions"); if(intent) intent.hidden=!!settings.hidden.intentions;
    var side=document.querySelector(".side"); if(side) side.hidden=!!settings.hidden.help;
    var mid=document.querySelector(".middle"); if(mid) mid.classList.toggle("nohelp", !!settings.hidden.help);
  }

  // Filtro tocchi: durata minima della pressione + intervallo minimo tra due tocchi + conferma visiva
  var lastAccepted=0, pressStart=0;
  document.addEventListener("pointerdown", function(){ pressStart=Date.now(); }, true);
  document.addEventListener("click", function(e){
    var el=e.target.closest ? e.target.closest(".btn,.key,.ctx,.phrase,.need,.hsugg,.sugg") : null;
    if(!el) return;
    if(document.getElementById("options").classList.contains("open")) return; // nel pannello opzioni nessun filtro
    var now=Date.now();
    if(settings.pressDuration>0 && pressStart && (now-pressStart) < settings.pressDuration){
      e.stopPropagation(); e.preventDefault(); return;   // pressione troppo breve
    }
    if(now-lastAccepted < settings.minInterval){
      e.stopPropagation(); e.preventDefault(); return;   // doppio tocco troppo ravvicinato
    }
    lastAccepted=now;
    if(settings.feedback){ el.classList.add("cmd-flash"); setTimeout(function(){ el.classList.remove("cmd-flash"); },220); }
  }, true);

  // ---- pannello opzioni ----
  function mk(tag,attrs,txt){
    var e=document.createElement(tag);
    if(attrs) for(var k in attrs){ if(k==="class") e.className=attrs[k]; else e.setAttribute(k,attrs[k]); }
    if(txt!=null) e.textContent=txt; return e;
  }
  function closeOptions(){ document.getElementById("options").classList.remove("open"); try{phrase.focus();}catch(e){} }
  document.getElementById("optClose").addEventListener("click", closeOptions);

  function renderPinEntry(title, onDigits){
    var body=document.getElementById("optBody"); body.innerHTML="";
    document.getElementById("optTitle").textContent=title;
    var buf=""; var disp=mk("div",{class:"pin-display"},""); body.appendChild(disp);
    function upd(){ disp.textContent=buf.replace(/./g,"•"); }
    var pad=mk("div",{class:"pinpad"});
    ["1","2","3","4","5","6","7","8","9"].forEach(function(d){
      var b=mk("button",{class:"opt-btn",type:"button"},d);
      b.addEventListener("click",function(){ if(buf.length<8){buf+=d;upd();} }); pad.appendChild(b);
    });
    var bc=mk("button",{class:"opt-btn",type:"button"},"←"); bc.addEventListener("click",function(){ buf=buf.slice(0,-1); upd(); });
    var b0=mk("button",{class:"opt-btn",type:"button"},"0"); b0.addEventListener("click",function(){ if(buf.length<8){buf+="0";upd();} });
    var bok=mk("button",{class:"opt-btn primary",type:"button"},"OK"); bok.addEventListener("click",function(){ onDigits(buf); });
    pad.appendChild(bc); pad.appendChild(b0); pad.appendChild(bok);
    body.appendChild(pad);
  }
  function renderPinGate(){ renderPinEntry("Inserisci il codice", function(code){ if(code===settings.pin){ renderOptions(); } else { renderPinGate(); } }); }
  function renderPinSetter(){ renderPinEntry("Nuovo codice, poi OK", function(code){ if(code.length>=3){ settings.pin=code; saveSettings(); renderOptions(); } else { renderPinSetter(); } }); }

  function renderOptions(){
    var body=document.getElementById("optBody"); body.innerHTML="";
    document.getElementById("optTitle").textContent="Opzioni (caregiver)";

    // Contatti
    var s1=mk("div",{class:"opt-sec"}); s1.appendChild(mk("h3",null,"Contatti"));
    var l1=mk("div",{class:"opt-list"});
    settings.contacts.forEach(function(c,i){
      var row=mk("div",{class:"opt-item"});
      var n=mk("input",{type:"text",placeholder:"Nome"}); n.value=c.name;
      n.addEventListener("input",function(){ settings.contacts[i].name=n.value; saveSettings(); renderContexts(); });
      var r=mk("input",{type:"text",placeholder:"relazione"}); r.value=c.rel||""; r.style.maxWidth="150px";
      r.addEventListener("input",function(){ settings.contacts[i].rel=r.value; saveSettings(); renderContexts(); });
      var del=mk("button",{class:"opt-btn danger",type:"button"},"✕");
      del.addEventListener("click",function(){ settings.contacts.splice(i,1); saveSettings(); renderContexts(); renderOptions(); });
      row.appendChild(n); row.appendChild(r); row.appendChild(del); l1.appendChild(row);
    });
    s1.appendChild(l1);
    var a1=mk("button",{class:"opt-btn primary",type:"button"},"+ Aggiungi contatto");
    a1.addEventListener("click",function(){ settings.contacts.push({name:"Nuovo",rel:""}); saveSettings(); renderContexts(); renderOptions(); });
    s1.appendChild(a1); body.appendChild(s1);

    // Frasi personalizzate
    var s2=mk("div",{class:"opt-sec"}); s2.appendChild(mk("h3",null,"Le mie frasi"));
    var l2=mk("div",{class:"opt-list"});
    settings.phrases.forEach(function(t,i){
      var row=mk("div",{class:"opt-item"});
      var inp=mk("input",{type:"text",placeholder:"Frase"}); inp.value=t;
      inp.addEventListener("input",function(){ settings.phrases[i]=inp.value; saveSettings(); });
      inp.addEventListener("change",function(){ renderContexts(); });
      var del=mk("button",{class:"opt-btn danger",type:"button"},"✕");
      del.addEventListener("click",function(){ settings.phrases.splice(i,1); saveSettings(); renderContexts(); renderOptions(); });
      row.appendChild(inp); row.appendChild(del); l2.appendChild(row);
    });
    s2.appendChild(l2);
    var a2=mk("button",{class:"opt-btn primary",type:"button"},"+ Aggiungi frase");
    a2.addEventListener("click",function(){ settings.phrases.push("Nuova frase"); saveSettings(); renderContexts(); renderOptions(); });
    s2.appendChild(a2); body.appendChild(s2);

    // Tocco e conferme
    var s3=mk("div",{class:"opt-sec"}); s3.appendChild(mk("h3",null,"Tocco e conferme"));
    var r3a=mk("div",{class:"opt-row"}); r3a.appendChild(mk("label",null,"Intervallo minimo tra due tocchi"));
    var selInt=mk("select");
    [["0","nessuno"],["250","250 ms"],["350","350 ms"],["500","500 ms"],["800","800 ms"]].forEach(function(o){ var op=mk("option",{value:o[0]},o[1]); if(String(settings.minInterval)===o[0]) op.selected=true; selInt.appendChild(op); });
    selInt.addEventListener("change",function(){ settings.minInterval=parseInt(selInt.value,10)||0; saveSettings(); });
    r3a.appendChild(selInt); s3.appendChild(r3a);
    var r3b=mk("div",{class:"opt-row"}); r3b.appendChild(mk("label",null,"Durata minima della pressione"));
    var selP=mk("select");
    [["0","immediato"],["300","0,3 s"],["600","0,6 s"],["1000","1 s"]].forEach(function(o){ var op=mk("option",{value:o[0]},o[1]); if(String(settings.pressDuration)===o[0]) op.selected=true; selP.appendChild(op); });
    selP.addEventListener("change",function(){ settings.pressDuration=parseInt(selP.value,10)||0; saveSettings(); });
    r3b.appendChild(selP); s3.appendChild(r3b);
    var r3c=mk("label",{class:"opt-check"}); var chk=mk("input",{type:"checkbox"}); chk.checked=!!settings.feedback;
    chk.addEventListener("change",function(){ settings.feedback=chk.checked; saveSettings(); });
    r3c.appendChild(chk); r3c.appendChild(document.createTextNode("Conferma visiva e sonora dopo ogni comando"));
    s3.appendChild(r3c); body.appendChild(s3);

    // Nascondi funzioni
    var s4=mk("div",{class:"opt-sec"}); s4.appendChild(mk("h3",null,"Nascondi funzioni non usate"));
    function hideCheck(key,label){
      var l=mk("label",{class:"opt-check"}); var c=mk("input",{type:"checkbox"}); c.checked=!!settings.hidden[key];
      c.addEventListener("change",function(){ settings.hidden[key]=c.checked; saveSettings(); applyHidden(); renderContexts(); });
      l.appendChild(c); l.appendChild(document.createTextNode(label)); return l;
    }
    s4.appendChild(hideCheck("intentions","Sì / No / Non so"));
    s4.appendChild(hideCheck("quickbar","Barra rapida in basso"));
    s4.appendChild(hideCheck("help","Tasto AIUTO"));
    contexts.forEach(function(c){ s4.appendChild(hideCheck("ctx_"+c.key,"Contesto: "+c.lab)); });
    body.appendChild(s4);

    // Codice caregiver
    var s5=mk("div",{class:"opt-sec"}); s5.appendChild(mk("h3",null,"Codice caregiver"));
    s5.appendChild(mk("div",{class:"opt-row"}, settings.pin?"Codice attivo: all'apertura viene richiesto.":"Nessun codice. Le opzioni si aprono con pressione prolungata sull'ingranaggio."));
    var r5=mk("div",{class:"opt-row"});
    var setBtn=mk("button",{class:"opt-btn",type:"button"}, settings.pin?"Cambia codice":"Imposta codice");
    setBtn.addEventListener("click",renderPinSetter); r5.appendChild(setBtn);
    if(settings.pin){ var rm=mk("button",{class:"opt-btn danger",type:"button"},"Togli codice"); rm.addEventListener("click",function(){ settings.pin=""; saveSettings(); renderOptions(); }); r5.appendChild(rm); }
    s5.appendChild(r5); body.appendChild(s5);
  }

  function openOptionsGate(){
    var o=document.getElementById("options"); o.classList.add("open");
    if(settings.pin){ renderPinGate(); } else { renderOptions(); }
    setTimeout(function(){ var el=document.getElementById("optClose"); if(el) el.focus(); },0);
  }
  (function(){
    var gear=document.getElementById("gearBtn");
    // Tocco normale: affidabile su iPhone/iPad/Android. La protezione è il PIN (se impostato).
    gear.addEventListener("click", function(e){ e.preventDefault(); openOptionsGate(); });
  })();

  applyHidden();

  setPhrase("");
  renderFreq();
})();
</script>
</body>
